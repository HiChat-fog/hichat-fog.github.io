name: Build & Deploy

on:
  push:
    branches:
      - source
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS deps 📦
        run: npm ci

      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          set -o pipefail
          bundle exec jekyll build 2>&1 | tee build.log

      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Deploy to master 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: master
          clean: true
          commit-message: "deploy: ${{ github.sha }}"

      - name: Save build log on failure 🧯
        if: failure()
        run: |
          mkdir -p /tmp/logpush && cd /tmp/logpush
          git init -q -b logs
          {
            echo "build failed at $(date -u)"
            echo '```'
            cat "${{ github.workspace }}/build.log" 2>/dev/null
            echo '```'
          } > build-error.log
          git add -A
          git -c user.name=build-bot -c user.email=bot@users.noreply.github.com commit -qm "build error log"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/HiChat-fog/hichat-fog.github.io.git" HEAD:logs
